
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Olvisión" />

  <title>Olvisión — Gastos</title>
  <link rel="stylesheet" href="app.css" />
  <link rel="icon" type="image/png" href="finanzas_logo.png" />
  <link rel="apple-touch-icon" href="finanzas_logo.png" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');</script>
  <style>
    .mes-selector { display: flex; align-items: center; justify-content: space-between; background: white; border-radius: 16px; padding: 14px 16px; margin-bottom: 16px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
    .mes-btn { background: none; border: none; font-size: 22px; cursor: pointer; color: #1E3A8A; padding: 4px 8px; }
    .mes-nombre { font-size: 17px; font-weight: 800; color: #1e293b; }

    .resumen { background: #1E3A8A; border-radius: 20px; padding: 20px; margin-bottom: 16px; color: white; }
    .resumen-titulo { font-size: 12px; font-weight: 700; color: #93c5fd; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 14px; }
    .resumen-total { font-size: 36px; font-weight: 900; margin-bottom: 4px; }
    .resumen-sub { font-size: 13px; color: #93c5fd; }

    .cats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .cat-card { background: white; border-radius: 16px; padding: 14px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); cursor: pointer; border: 2px solid transparent; transition: border-color 0.2s; }
    .cat-card.activa { border-color: #1E3A8A; }
    .cat-icon { font-size: 20px; margin-bottom: 6px; }
    .cat-nombre { font-size: 11px; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
    .cat-monto { font-size: 18px; font-weight: 900; color: #1e293b; margin-top: 2px; }

    .filtros { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 4px; }
    .filtros::-webkit-scrollbar { display: none; }
    .filtro-btn { background: white; border: 2px solid #e2e8f0; border-radius: 20px; padding: 6px 14px; font-size: 13px; font-weight: 700; color: #64748b; cursor: pointer; white-space: nowrap; font-family: inherit; transition: all 0.2s; }
    .filtro-btn.activo { background: #1E3A8A; border-color: #1E3A8A; color: white; }

    .export-row { display: flex; gap: 10px; margin-bottom: 20px; }
    .btn-export { flex: 1; background: white; border: 2px solid #e2e8f0; border-radius: 12px; padding: 10px; font-size: 13px; font-weight: 700; color: #1E3A8A; cursor: pointer; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.2s; }
    .btn-export:hover { background: #f0f4ff; border-color: #1E3A8A; }

    .lista { display: flex; flex-direction: column; gap: 10px; }
    .gasto-card { background: white; border-radius: 16px; padding: 14px 16px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .gasto-info { flex: 1; }
    .gasto-desc { font-size: 15px; font-weight: 800; color: #1e293b; }
    .gasto-det { font-size: 12px; color: #64748b; margin-top: 2px; }
    .gasto-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    .gasto-monto { font-size: 17px; font-weight: 900; color: #ef4444; white-space: nowrap; }
    .gasto-fecha { font-size: 11px; color: #94a3b8; margin-top: 2px; text-align: right; }
    .gasto-acciones { display: flex; flex-direction: column; gap: 4px; }
    .btn-accion { background: none; border: none; font-size: 17px; cursor: pointer; padding: 4px; color: #cbd5e1; }

    .anual-toggle { background: white; border: 2px solid #e2e8f0; border-radius: 14px; padding: 14px 16px; font-size: 15px; font-weight: 700; color: #1E3A8A; cursor: pointer; font-family: inherit; width: 100%; text-align: left; margin-top: 24px; display: flex; justify-content: space-between; align-items: center; }
    .anual-panel { display: none; background: white; border-radius: 0 0 14px 14px; border: 2px solid #e2e8f0; border-top: none; padding: 12px; margin-top: -2px; }
    .anual-panel.visible { display: block; }
    .anual-mes-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 4px; border-bottom: 1px solid #f1f5f9; cursor: pointer; border-radius: 8px; }
    .anual-mes-row:last-child { border-bottom: none; }
    .anual-mes-nombre { font-size: 14px; font-weight: 700; color: #1e293b; }
    .anual-mes-monto { font-size: 15px; font-weight: 900; color: #ef4444; }
    .anual-mes-cant { font-size: 12px; color: #94a3b8; }
    .anual-total-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 4px 4px; margin-top: 4px; border-top: 2px solid #1E3A8A; }
    .anual-total-label { font-size: 14px; font-weight: 900; color: #1E3A8A; }
    .anual-total-monto { font-size: 18px; font-weight: 900; color: #1E3A8A; }
    .anual-loading { text-align: center; color: #94a3b8; font-size: 14px; padding: 20px; }

    @media (min-width: 768px) {
      .cats-grid { grid-template-columns: repeat(4, 1fr); }
    }

    /* REPORTE IMAGEN */
    #reporte-img {
      position: fixed; left: -9999px; top: 0;
      width: 420px; background: white;
      font-family: 'Nunito', sans-serif;
    }
    .rep-header { background: #1E3A8A; color: white; padding: 24px 24px 20px; }
    .rep-logo { font-size: 24px; font-weight: 900; letter-spacing: 1px; }
    .rep-subtitulo { font-size: 12px; color: #93c5fd; margin-top: 2px; }
    .rep-mes { font-size: 20px; font-weight: 900; margin-top: 14px; }
    .rep-total-label { font-size: 11px; color: #93c5fd; text-transform: uppercase; letter-spacing: 1px; margin-top: 14px; }
    .rep-total { font-size: 34px; font-weight: 900; }
    .rep-body { padding: 20px 24px; }
    .rep-cats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .rep-cat { background: #f8fafc; border-radius: 10px; padding: 10px 12px; }
    .rep-cat-nombre { font-size: 10px; font-weight: 700; color: #94a3b8; text-transform: uppercase; }
    .rep-cat-monto { font-size: 17px; font-weight: 900; color: #1e293b; }
    .rep-divider { height: 1px; background: #e2e8f0; margin: 14px 0; }
    .rep-row { display: flex; justify-content: space-between; align-items: flex-start; padding: 9px 0; border-bottom: 1px solid #f1f5f9; gap: 10px; }
    .rep-row:last-child { border-bottom: none; }
    .rep-row-desc { font-size: 13px; font-weight: 700; color: #1e293b; flex: 1; }
    .rep-row-cat { font-size: 11px; color: #64748b; margin-top: 2px; }
    .rep-row-monto { font-size: 13px; font-weight: 900; color: #ef4444; white-space: nowrap; }
    .rep-row-fecha { font-size: 11px; color: #94a3b8; margin-top: 2px; }
    .rep-footer { background: #f8fafc; padding: 14px 24px; text-align: center; font-size: 12px; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-brand"><img src="logo_app.png" alt="Olvisión" /></div>
      <nav class="sidebar-nav">
        <a class="snav-item" href="dashboard.html"><span class="snav-icon">🏠</span> Inicio</a>
        <a class="snav-item" href="caja.html"><span class="snav-icon">🧾</span> Caja Diaria</a>
        <a class="snav-item activo" href="gastos.html"><span class="snav-icon">💸</span> Gastos</a>
        <a class="snav-item" href="cheques.html"><span class="snav-icon">🏦</span> Cheques</a>
        <a class="snav-item" href="sueldos.html"><span class="snav-icon">👥</span> Sueldos</a>
        <a class="snav-item" href="saldos.html"><span class="snav-icon">🔖</span> Saldos</a>
      </nav>
      <div class="sidebar-footer">
        <button class="btn-salir-sidebar" onclick="salir()">🚪 Salir</button>
      </div>
    </aside>

    <div class="app-content">
      <nav class="nav">
        <div class="nav-left">
          <a class="nav-back" href="dashboard.html">‹</a>
          <div>
            <div class="nav-title">💸 Gastos</div>
            <div class="nav-sub" id="nav-sub">—</div>
          </div>
        </div>
      </nav>

      <main class="main">
        <div class="mes-selector">
          <button class="mes-btn" onclick="cambiarMes(-1)">‹</button>
          <span class="mes-nombre" id="mes-nombre">—</span>
          <button class="mes-btn" onclick="cambiarMes(1)">›</button>
        </div>

        <div class="resumen">
          <div class="resumen-titulo">💸 Total del mes</div>
          <div class="resumen-total" id="res-total">$0</div>
          <div class="resumen-sub" id="res-cant">0 gastos registrados</div>
        </div>

        <div class="cats-grid" id="cats-grid"></div>

        <div class="filtros">
          <button class="filtro-btn activo" onclick="filtrar('Todos', this)">Todos</button>
          <button class="filtro-btn" onclick="filtrar('Gastos admin', this)">🏢 Gastos admin</button>
          <button class="filtro-btn" onclick="filtrar('Costos Admin.', this)">📋 Costos Admin.</button>
          <button class="filtro-btn" onclick="filtrar('Retiro Andres', this)">👤 Retiro Andres</button>
          <button class="filtro-btn" onclick="filtrar('Retiro Luisito', this)">👤 Retiro Luisito</button>
        </div>

        <div class="export-row">
          <button class="btn-export" id="btn-img" onclick="exportarImagen()">📸 Imagen</button>
          <button class="btn-export" id="btn-xlsx" onclick="exportarExcel()">📊 Excel</button>
        </div>

        <button class="btn-primario" onclick="abrirModal()" style="margin-bottom:20px">+ Registrar gasto</button>

        <div class="section-title">📋 Detalle</div>
        <div class="lista" id="lista-gastos"><p class="empty">Cargando...</p></div>

        <button class="anual-toggle" onclick="toggleAnual()">
          <span>📅 Resumen anual <span id="anual-anio"></span></span>
          <span id="anual-arrow">▼</span>
        </button>
        <div class="anual-panel" id="anual-panel">
          <div class="anual-loading" id="anual-loading">Cargando...</div>
          <div id="anual-contenido"></div>
        </div>
      </main>

      <nav class="bottom-nav">
        <a class="bnav-item" href="dashboard.html"><span class="bnav-icon">🏠</span><span class="bnav-label">Inicio</span></a>
        <a class="bnav-item" href="caja.html"><span class="bnav-icon">🧾</span><span class="bnav-label">Caja</span></a>
        <a class="bnav-item activo" href="gastos.html"><span class="bnav-icon">💸</span><span class="bnav-label">Gastos</span></a>
        <a class="bnav-item" href="cheques.html"><span class="bnav-icon">🏦</span><span class="bnav-label">Cheques</span></a>
        <a class="bnav-item" href="sueldos.html"><span class="bnav-icon">👥</span><span class="bnav-label">Sueldos</span></a>
      </nav>
    </div>
  </div>

  <!-- MODAL -->
  <div class="overlay" id="overlay" onclick="cerrarModalFuera(event)">
    <div class="modal">
      <div class="modal-titulo" id="modal-titulo">Registrar gasto</div>
      <div class="campo"><label>Fecha</label><input type="date" id="f-fecha" /></div>
      <div class="campo"><label>Descripción</label><input type="text" id="f-desc" placeholder="Ej: Pago de alquiler" autocomplete="off" /></div>
      <div class="campo"><label>Categoría</label>
        <select id="f-cat">
          <option value="">Seleccionar</option>
          <option>Gastos admin</option>
          <option>Costos Admin.</option>
          <option>Retiro Andres</option>
          <option>Retiro Luisito</option>
        </select>
      </div>
      <div class="campo"><label>Monto $</label><input type="text" data-miles="true" id="f-monto" placeholder="0" inputmode="numeric" oninput="fmtMiles(this)" /></div>
      <div class="campo"><label>Forma de pago</label>
        <select id="f-forma">
          <option value="">Seleccionar</option>
          <option>Efectivo</option><option>T. Credito</option><option>Debito</option><option>QR</option><option>Transferencia</option>
        </select>
      </div>
      <div class="campo"><label>Observación (opcional)</label><input type="text" id="f-obs" placeholder="Notas adicionales..." autocomplete="off" /></div>
      <button class="btn-guardar" onclick="guardar()">✅ Guardar</button>
      <button class="btn-cancelar" onclick="cerrarModal()">Cancelar</button>
    </div>
  </div>

  <!-- DIV OCULTO PARA IMAGEN -->
  <div id="reporte-img">
    <div class="rep-header">
      <div class="rep-logo">OLVISIÓN</div>
      <div class="rep-subtitulo">Óptica · Yerba Buena, Tucumán</div>
      <div class="rep-mes" id="rep-mes">—</div>
      <div class="rep-total-label">TOTAL DE GASTOS</div>
      <div class="rep-total" id="rep-total-rep">$0</div>
    </div>
    <div class="rep-body">
      <div class="rep-cats" id="rep-cats"></div>
      <div class="rep-divider"></div>
      <div id="rep-lista"></div>
    </div>
    <div class="rep-footer" id="rep-footer">Generado el —</div>
  </div>

  <script>
    if (!sessionStorage.getItem('olvision_auth')) window.location.href = 'index.html';
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
    const CATEGORIAS = [
      { nombre: 'Gastos admin', icon: '🏢' },
      { nombre: 'Costos Admin.', icon: '📋' },
      { nombre: 'Retiro Andres', icon: '👤' },
      { nombre: 'Retiro Luisito', icon: '👤' }
    ];

    let mesActual = new Date().getMonth();
    let anioActual = new Date().getFullYear();
    let gastos = [];
    let filtroActual = 'Todos';
    let editandoId = null;
    let anualAbierto = false;

    function getMesStr() {
      return `${anioActual}-${String(mesActual + 1).padStart(2, '0')}`;
    }
    function getMesSiguienteStr() {
      if (mesActual === 11) return `${anioActual + 1}-01-01`;
      return `${anioActual}-${String(mesActual + 2).padStart(2, '0')}-01`;
    }
    function formatPesos(n) {
      if (!n || isNaN(n)) return '$0';
      return '$' + Math.round(n).toLocaleString('es-AR');
    }
    function formatFecha(f) {
      if (!f) return '';
      const [y, m, d] = f.split('-');
      return `${d}/${m}/${y}`;
    }
    function salir() {
      sessionStorage.removeItem('olvision_auth');
      window.location.href = 'index.html';
    }

    function actualizarHeader() {
      document.getElementById('mes-nombre').textContent = `${MESES[mesActual]} ${anioActual}`;
      document.getElementById('nav-sub').textContent = `${MESES[mesActual]} ${anioActual}`;
      document.getElementById('anual-anio').textContent = anioActual;
    }

    function cambiarMes(dir) {
      mesActual += dir;
      if (mesActual > 11) { mesActual = 0; anioActual++; }
      if (mesActual < 0) { mesActual = 11; anioActual--; }
      filtroActual = 'Todos';
      document.querySelectorAll('.filtro-btn').forEach(b => b.classList.remove('activo'));
      document.querySelector('.filtro-btn').classList.add('activo');
      actualizarHeader();
      cargar();
      if (anualAbierto) cargarAnual();
    }

    async function cargar() {
      const mes = getMesStr();
      const cacheKey = 'gastos_' + mes;
      const cached = OlvisionCache.get(cacheKey);
      if (cached) { gastos = cached; renderTodo(); }
      const { data } = await db.from('gastos').select('*')
        .gte('fecha', mes + '-01')
        .lt('fecha', getMesSiguienteStr())
        .order('fecha', { ascending: false });
      gastos = data || [];
      OlvisionCache.set(cacheKey, gastos);
      renderTodo();
    }

    function gastosFiltrados() {
      if (filtroActual === 'Todos') return gastos;
      return gastos.filter(g => g.categoria === filtroActual);
    }

    function renderTodo() {
      const total = gastos.reduce((s, g) => s + (parseFloat(g.monto) || 0), 0);
      document.getElementById('res-total').textContent = formatPesos(total);
      document.getElementById('res-cant').textContent = `${gastos.length} gasto${gastos.length !== 1 ? 's' : ''} registrado${gastos.length !== 1 ? 's' : ''}`;

      document.getElementById('cats-grid').innerHTML = CATEGORIAS.map(c => {
        const subtotal = gastos.filter(g => g.categoria === c.nombre).reduce((s, g) => s + (parseFloat(g.monto) || 0), 0);
        const activa = filtroActual === c.nombre ? 'activa' : '';
        return `<div class="cat-card ${activa}" onclick="filtrarCat('${c.nombre}', this)">
          <div class="cat-icon">${c.icon}</div>
          <div class="cat-nombre">${c.nombre}</div>
          <div class="cat-monto">${formatPesos(subtotal)}</div>
        </div>`;
      }).join('');

      renderLista();
    }

    function renderLista() {
      const lista = document.getElementById('lista-gastos');
      const datos = gastosFiltrados();
      if (datos.length === 0) {
        lista.innerHTML = `<div class="empty">No hay gastos${filtroActual !== 'Todos' ? ' en esta categoría' : ' este mes'}<br>Tocá + para agregar</div>`;
        return;
      }
      lista.innerHTML = datos.map(g => `
        <div class="gasto-card">
          <div class="gasto-info">
            <div class="gasto-desc">${g.descripcion || '—'}</div>
            <div class="gasto-det">${g.forma_pago || '—'}${g.observacion ? ' · ' + g.observacion : ''}</div>
            <div class="gasto-tags">${g.categoria ? `<span class="tag">${g.categoria}</span>` : ''}</div>
          </div>
          <div style="text-align:right">
            <div class="gasto-monto">-${formatPesos(g.monto)}</div>
            <div class="gasto-fecha">${formatFecha(g.fecha)}</div>
          </div>
          <div class="gasto-acciones">
            <button class="btn-accion" onclick="abrirEditar('${g.id}')">✏️</button>
            <button class="btn-accion" onclick="eliminar('${g.id}')">🗑️</button>
          </div>
        </div>`).join('');
    }

    /* ===== FILTROS ===== */
    function filtrar(cat, btn) {
      filtroActual = cat;
      document.querySelectorAll('.filtro-btn').forEach(b => b.classList.remove('activo'));
      btn.classList.add('activo');
      document.querySelectorAll('.cat-card').forEach(c => c.classList.remove('activa'));
      renderLista();
    }

    function filtrarCat(cat, card) {
      if (filtroActual === cat) {
        filtroActual = 'Todos';
        document.querySelectorAll('.cat-card').forEach(c => c.classList.remove('activa'));
        document.querySelectorAll('.filtro-btn').forEach(b => b.classList.remove('activo'));
        document.querySelector('.filtro-btn').classList.add('activo');
      } else {
        filtroActual = cat;
        document.querySelectorAll('.cat-card').forEach(c => c.classList.remove('activa'));
        card.classList.add('activa');
        document.querySelectorAll('.filtro-btn').forEach(b => {
          b.classList.toggle('activo', b.textContent.includes(cat));
        });
      }
      renderLista();
    }

    /* ===== MODAL ===== */
    function abrirModal() {
      editandoId = null;
      document.getElementById('modal-titulo').textContent = 'Registrar gasto';
      document.getElementById('f-fecha').value = new Date().toISOString().split('T')[0];
      limpiarForm();
      document.getElementById('overlay').classList.add('visible');
    }

    function abrirEditar(id) {
      const g = gastos.find(x => x.id === id);
      if (!g) return;
      editandoId = id;
      document.getElementById('modal-titulo').textContent = '✏️ Editar gasto';
      document.getElementById('f-fecha').value = g.fecha || '';
      document.getElementById('f-desc').value = g.descripcion || '';
      setVal(document.getElementById('f-monto'), g.monto);
      document.getElementById('f-obs').value = g.observacion || '';
      const catSel = document.getElementById('f-cat');
      for (let i = 0; i < catSel.options.length; i++) {
        if (catSel.options[i].text === g.categoria) { catSel.selectedIndex = i; break; }
      }
      const formaSel = document.getElementById('f-forma');
      for (let i = 0; i < formaSel.options.length; i++) {
        if (formaSel.options[i].text === g.forma_pago) { formaSel.selectedIndex = i; break; }
      }
      document.getElementById('overlay').classList.add('visible');
    }

    function cerrarModal() {
      document.getElementById('overlay').classList.remove('visible');
      editandoId = null;
      limpiarForm();
    }
    function cerrarModalFuera(e) {
      if (e.target === document.getElementById('overlay')) cerrarModal();
    }
    function limpiarForm() {
      ['f-desc', 'f-monto', 'f-obs'].forEach(id => document.getElementById(id).value = '');
      ['f-cat', 'f-forma'].forEach(id => document.getElementById(id).selectedIndex = 0);
    }

    async function guardar() {
      const fecha = document.getElementById('f-fecha').value;
      const desc = document.getElementById('f-desc').value.trim();
      const monto = getVal(document.getElementById('f-monto'));
      const categoria = document.getElementById('f-cat').value;
      const forma_pago = document.getElementById('f-forma').value;
      const observacion = document.getElementById('f-obs').value.trim();

      if (!desc) { alert('Ingresá una descripción'); return; }
      if (!monto || isNaN(monto)) { alert('Ingresá el monto'); return; }

      const btn = document.querySelector('.btn-guardar');
      btn.textContent = 'Guardando...'; btn.disabled = true;

      let error;
      if (editandoId) {
        ({ error } = await db.from('gastos').update({
          fecha, descripcion: desc, categoria, monto, forma_pago, observacion,
          mes: fecha.substring(0, 7)
        }).eq('id', editandoId));
      } else {
        ({ error } = await db.from('gastos').insert([{
          fecha, descripcion: desc, categoria, monto, forma_pago, observacion,
          mes: fecha.substring(0, 7)
        }]));
      }

      if (error) { alert('Error: ' + error.message); btn.textContent = '✅ Guardar'; btn.disabled = false; return; }

      OlvisionCache.clear('gastos_' + getMesStr());
      cerrarModal();
      await cargar();
      btn.textContent = '✅ Guardar'; btn.disabled = false;
    }

    async function eliminar(id) {
      if (!confirm('¿Eliminar este gasto?')) return;
      await db.from('gastos').delete().eq('id', id);
      OlvisionCache.clear('gastos_' + getMesStr());
      await cargar();
    }

    /* ===== EXPORTAR IMAGEN ===== */
    async function exportarImagen() {
      if (gastos.length === 0) { alert('No hay gastos este mes para exportar.'); return; }
      const btn = document.getElementById('btn-img');
      btn.textContent = '⏳ Generando...'; btn.disabled = true;

      const mesStr = `${MESES[mesActual]} ${anioActual}`;
      const total = gastos.reduce((s, g) => s + (parseFloat(g.monto) || 0), 0);

      document.getElementById('rep-mes').textContent = mesStr;
      document.getElementById('rep-total-rep').textContent = formatPesos(total);
      document.getElementById('rep-cats').innerHTML = CATEGORIAS.map(c => {
        const sub = gastos.filter(g => g.categoria === c.nombre).reduce((s, g) => s + (parseFloat(g.monto) || 0), 0);
        return `<div class="rep-cat">
          <div class="rep-cat-nombre">${c.icon} ${c.nombre}</div>
          <div class="rep-cat-monto">${formatPesos(sub)}</div>
        </div>`;
      }).join('');

      const sorted = [...gastos].sort((a, b) => new Date(a.fecha) - new Date(b.fecha));
      document.getElementById('rep-lista').innerHTML = sorted.map(g => `
        <div class="rep-row">
          <div style="flex:1">
            <div class="rep-row-desc">${g.descripcion || '—'}</div>
            <div class="rep-row-cat">${g.categoria || ''}${g.observacion ? ' · ' + g.observacion : ''}</div>
          </div>
          <div style="text-align:right">
            <div class="rep-row-monto">-${formatPesos(g.monto)}</div>
            <div class="rep-row-fecha">${formatFecha(g.fecha)}</div>
          </div>
        </div>`).join('');

      const hoy = new Date().toLocaleDateString('es-AR');
      document.getElementById('rep-footer').textContent = `Olvisión · Generado el ${hoy}`;

      try {
        const canvas = await html2canvas(document.getElementById('reporte-img'), {
          scale: 2, backgroundColor: '#ffffff', useCORS: true, logging: false
        });
        const link = document.createElement('a');
        link.download = `gastos_${getMesStr()}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      } catch(e) {
        alert('Error al generar imagen: ' + e.message);
      }

      btn.textContent = '📸 Imagen'; btn.disabled = false;
    }

    /* ===== EXPORTAR EXCEL ===== */
    function exportarExcel() {
      if (gastos.length === 0) { alert('No hay gastos este mes para exportar.'); return; }
      const wb = XLSX.utils.book_new();

      // Hoja Detalle
      const detalle = [...gastos]
        .sort((a, b) => new Date(a.fecha) - new Date(b.fecha))
        .map(g => ({
          'Fecha': formatFecha(g.fecha),
          'Descripción': g.descripcion || '',
          'Categoría': g.categoria || '',
          'Monto': parseFloat(g.monto) || 0,
          'Forma de Pago': g.forma_pago || '',
          'Observación': g.observacion || ''
        }));
      const ws1 = XLSX.utils.json_to_sheet(detalle);
      ws1['!cols'] = [{ wch: 12 }, { wch: 30 }, { wch: 18 }, { wch: 14 }, { wch: 16 }, { wch: 25 }];
      XLSX.utils.book_append_sheet(wb, ws1, 'Detalle');

      // Hoja Resumen por categoría
      const resumenData = CATEGORIAS.map(c => ({
        'Categoría': c.nombre,
        'Cantidad': gastos.filter(g => g.categoria === c.nombre).length,
        'Total': gastos.filter(g => g.categoria === c.nombre).reduce((s, g) => s + (parseFloat(g.monto) || 0), 0)
      }));
      resumenData.push({
        'Categoría': 'TOTAL',
        'Cantidad': gastos.length,
        'Total': gastos.reduce((s, g) => s + (parseFloat(g.monto) || 0), 0)
      });
      const ws2 = XLSX.utils.json_to_sheet(resumenData);
      ws2['!cols'] = [{ wch: 20 }, { wch: 12 }, { wch: 16 }];
      XLSX.utils.book_append_sheet(wb, ws2, 'Resumen');

      XLSX.writeFile(wb, `gastos_${getMesStr()}.xlsx`);
    }

    /* ===== RESUMEN ANUAL ===== */
    function toggleAnual() {
      anualAbierto = !anualAbierto;
      document.getElementById('anual-panel').classList.toggle('visible', anualAbierto);
      document.getElementById('anual-arrow').textContent = anualAbierto ? '▲' : '▼';
      if (anualAbierto) cargarAnual();
    }

    async function cargarAnual() {
      document.getElementById('anual-loading').style.display = 'block';
      document.getElementById('anual-contenido').innerHTML = '';

      const { data } = await db.from('gastos').select('fecha, monto')
        .gte('fecha', `${anioActual}-01-01`)
        .lt('fecha', `${anioActual + 1}-01-01`);

      document.getElementById('anual-loading').style.display = 'none';

      if (!data || data.length === 0) {
        document.getElementById('anual-contenido').innerHTML = `<p class="empty" style="text-align:center;padding:16px">No hay gastos en ${anioActual}</p>`;
        return;
      }

      const porMes = {};
      data.forEach(g => {
        const m = g.fecha.substring(0, 7);
        if (!porMes[m]) porMes[m] = { total: 0, cant: 0 };
        porMes[m].total += parseFloat(g.monto) || 0;
        porMes[m].cant++;
      });

      const totalAnual = data.reduce((s, g) => s + (parseFloat(g.monto) || 0), 0);
      const mesesOrdenados = Object.keys(porMes).sort();

      let html = mesesOrdenados.map(m => {
        const [y, mo] = m.split('-');
        const nombre = MESES[parseInt(mo) - 1];
        const esMesActual = m === getMesStr();
        return `<div class="anual-mes-row" onclick="irAMes('${m}')" style="${esMesActual ? 'background:#f0f4ff;' : ''}">
          <div>
            <div class="anual-mes-nombre">${esMesActual ? '▶ ' : ''}${nombre} ${y}</div>
            <div class="anual-mes-cant">${porMes[m].cant} gasto${porMes[m].cant !== 1 ? 's' : ''}</div>
          </div>
          <div class="anual-mes-monto">-${formatPesos(porMes[m].total)}</div>
        </div>`;
      }).join('');

      html += `<div class="anual-total-row">
        <div class="anual-total-label">Total ${anioActual}</div>
        <div class="anual-total-monto">-${formatPesos(totalAnual)}</div>
      </div>`;

      document.getElementById('anual-contenido').innerHTML = html;
    }

    function irAMes(mesStr) {
      const [y, m] = mesStr.split('-');
      anioActual = parseInt(y);
      mesActual = parseInt(m) - 1;
      filtroActual = 'Todos';
      document.querySelectorAll('.filtro-btn').forEach(b => b.classList.remove('activo'));
      document.querySelector('.filtro-btn').classList.add('activo');
      actualizarHeader();
      cargar();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    actualizarHeader();
    cargar();
  </script>
</body>
